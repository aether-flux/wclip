[package]
name = "dev-chall-launch"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
axum = { version = "0.8.9", features = ["ws"] }
local-ip-address = "0.6.13"
qr2term = "0.3.3"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
